const PRICES = { min: 150, max: 4500 };
function randPrice(name) {
  let h = 0; for (let c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return Math.floor(150 + (h % 4351));
}
function randStock(name) {
  let h = 0; for (let c of name) h = (h * 17 + c.charCodeAt(0)) & 0xff;
  return [3,5,8,12,15,20,25][h % 7];
}
function randSku(brand, model, part) {
  const b = brand.slice(0,2).toUpperCase();
  const m = model.replace(/\s/g,'').slice(0,3).toUpperCase();
  const p = part.replace(/\s/g,'').slice(0,3).toUpperCase();
  let h = 0; for (let c of part) h = (h*13+c.charCodeAt(0))&0xfff;
  return `${b}-${m}-${p}${h.toString(16).toUpperCase().padStart(3,'0')}`;
}

function HoverCard({ style, hoverStyle, children, onClick }) {
  const [hov, setHov] = useState(false);
  return (
    <div
      style={{ ...style, ...(hov ? hoverStyle : {}) }}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      onClick={onClick}
    >{children}</div>
  );
}

            <div style={{ ...S.cardBar, background: `linear-gradient(90deg,${info.color},${info.color}88)` }} />
          </HoverCard>
        ))}
      </div>
    </div>
  );
}

/* ─── PAGE 3: Categories ─── */
function CategoriesPage({ brand, model, onSelect }) {
  const info = DATA[brand];
  return (
    <div style={S.page}>
      <div style={{ ...S.hero, background: `linear-gradient(135deg,#111318 0%,${info.color}18 100%)` }}>
        <div style={S.heroGrid} />
        <div style={S.heroContent}>
          <div style={{ ...S.tag, color: info.color, background: info.color + '20', borderColor: info.color + '50' }}>
            {info.emoji} {brand} — {model}
          </div>
          <h1 style={S.h1}>Select<br /><span style={{ color: info.color }}>Part Category</span></h1>
          <p style={S.sub}>Choose the system or component category to find your exact part.</p>
        </div>
      </div>
      <div style={{ ...S.grid4, gridTemplateColumns: 'repeat(auto-fill,minmax(240px,1fr))' }}>
        {Object.entries(info.categories).map(([cat, parts]) => (
          <HoverCard key={cat}
            style={S.catCard}
            hoverStyle={{ borderColor: info.color + '80', boxShadow: `0 0 0 1px ${info.color}30`, transform: 'translateY(-3px)' }}
            onClick={() => onSelect(cat)}>
            <div style={{ ...S.catIcon, background: info.color + '20', fontSize: '1.5rem' }}>
              {CAT_ICONS[cat] || '🔩'}
            </div>
            <div>
              <div style={S.catTitle}>{cat}</div>
              <div style={S.catCount}>{parts.length} parts available</div>
            </div>
          </HoverCard>
        ))}
      </div>
    </div>
  );
}

/* ─── PAGE 4: Parts List ─── */
function PartsPage({ brand, model, category, onSelect }) {
  const info = DATA[brand];
  const parts = info.categories[category];
  const [filter, setFilter] = useState('');
  const filtered = parts.filter(p => p.toLowerCase().includes(filter.toLowerCase()));

  return (
    <div style={S.page}>
      <div style={{ ...S.hero, background: `linear-gradient(135deg,#111318 0%,${info.color}18 100%)` }}>
        <div style={S.heroGrid} />
        <div style={S.heroContent}>
          <div style={{ ...S.tag, color: info.color, background: info.color + '20', borderColor: info.color + '50' }}>
            {CAT_ICONS[category] || '🔩'} {brand} {model} — {category}
          </div>
          <h1 style={S.h1}>Available<br /><span style={{ color: info.color }}>Spare Parts</span></h1>
          <p style={S.sub}>{parts.length} original parts available for {model}. Click a part to view details.</p>
        </div>
      </div>
      <div style={{ padding: '24px 5% 0' }}>
        <input
          style={{ ...S.input, maxWidth: 400, marginBottom: 0 }}
          placeholder={`🔍  Search ${category} parts...`}
          value={filter}
          onChange={e => setFilter(e.target.value)}
          onFocus={e => e.target.style.borderColor = '#e8a020'}
          onBlur={e => e.target.style.borderColor = '#252830'}
        />
      </div>
      <div style={S.grid4}>
        {filtered.map(part => {
          const price = randPrice(brand + model + part);
          const stock = randStock(brand + model + part);
          const sku = randSku(brand, model, part);
          return (
            <HoverCard key={part}
              style={S.partCard}
              hoverStyle={{ borderColor: info.color + '80', transform: 'translateY(-3px)', boxShadow: `0 8px 30px ${info.color}18` }}
              onClick={() => onSelect(part)}>
              <div style={S.partTop}>
                <div style={S.partName}>{part}</div>
                <div style={S.partPrice}>৳{price.toLocaleString()}</div>
              </div>
              <div style={S.partSku}>SKU: {sku}</div>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={S.partStock}>● {stock} in stock</span>
                <span style={{ fontSize: '.78rem', color: '#7a7f8e' }}>{category}</span>
              </div>
              <button style={{ ...S.waBtn, fontSize: '.78rem', padding: '7px 12px', marginTop: 12 }}
                onClick={e => { e.stopPropagation(); window.open(`https://wa.me/8801707659954?text=I%20need%20${encodeURIComponent(part)}%20for%20${encodeURIComponent(brand)}%20${encodeURIComponent(model)}`, '_blank'); }}>
                💬 Order on WhatsApp
              </button>
            </HoverCard>
          );
        })}
        {filtered.length === 0 && (
          <div style={{ gridColumn: '1/-1', textAlign: 'center', padding: '60px 0', color: '#7a7f8e' }}>
            <div style={{ fontSize: '3rem', marginBottom: 12 }}>🔍</div>
            <div style={{ fontFamily: 'var(--fh)', fontSize: '1.2rem', textTransform: 'uppercase' }}>No parts found</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── PAGE 5: Product Detail ─── */
const CAT_EMOJI = { Engine:'🔧', Suspension:'🛞', Brakes:'🛑', Electrical:'⚡', 'Fuel System':'⛽', Transmission:'⚙️', 'Body Parts':'🛡️', Cooling:'🌡️' };

function ProductPage({ brand, model, category, part }) {
  const info = DATA[brand];
  const price = randPrice(brand + model + part);
  const stock = randStock(brand + model + part);
  const sku = randSku(brand, model, part);

  // Editable fields — stored in state per session
  const storageKey = `borhan_part_${sku}`;
  const saved = (() => { try { return JSON.parse(localStorage.getItem(storageKey)) || {} } catch { return {} } })();

  const [desc, setDesc] = useState(saved.desc || `Genuine original ${part} for ${brand} ${model}. Sourced from authorized distributors. Ensures optimal performance and longevity.`);
  const [weight, setWeight] = useState(saved.weight || '');
  const [partNo, setPartNo] = useState(saved.partNo || sku);
  const [warranty, setWarranty] = useState(saved.warranty || '6 Months');
  const [origin, setOrigin] = useState(saved.origin || 'India');
  const [notes, setNotes] = useState(saved.notes || '');
  const [savedOk, setSavedOk] = useState(false);

  function handleSave() {
    localStorage.setItem(storageKey, JSON.stringify({ desc, weight, partNo, warranty, origin, notes }));
    setSavedOk(true);
    setTimeout(() => setSavedOk(false), 2500);
  }

  const waMsg = `I want to order: ${part}\nBike: ${brand} ${model}\nSKU: ${sku}\nPrice: ৳${price.toLocaleString()}`;

  return (
    <div style={S.page}>
      <div style={{ ...S.hero, padding: '40px 5% 32px', background: `linear-gradient(135deg,#111318 0%,${info.color}18 100%)` }}>
        <div style={S.heroGrid} />
        <div style={S.heroContent}>
          <div style={{ ...S.tag, color: info.color, background: info.color + '20', borderColor: info.color + '50' }}>
            {info.emoji} {brand} · {model} · {category}
          </div>
          <h1 style={{ ...S.h1, fontSize: 'clamp(1.6rem,4vw,2.8rem)' }}>{part}</h1>
        </div>
      </div>

      <div style={S.detailWrap}>
        <div style={{ ...S.detailGrid, ...(window.innerWidth < 700 ? { gridTemplateColumns: '1fr' } : {}) }}>

          {/* LEFT — image box */}
          <div>
            <div style={{ ...S.imgBox, background: `linear-gradient(135deg,#16191f,${info.color}12)` }}>
              <div style={{ position: 'absolute', inset: 0, backgroundImage: 'linear-gradient(rgba(232,160,32,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,160,32,.03) 1px,transparent 1px)', backgroundSize: '30px 30px' }} />
              <span style={{ ...S.imgEmoji, position: 'relative' }}>{CAT_EMOJI[category] || '🔩'}</span>
              <span style={S.imgLabel}>{brand} · {model}</span>
              <span style={{ ...S.imgLabel, fontSize: '.75rem', opacity: .6 }}>{part}</span>
            </div>

            {/* Meta grid below image */}
            <div style={{ ...S.metaGrid, marginTop: 16, marginBottom: 0 }}>
              <div style={S.metaItem}>
                <div style={S.metaLabel}>SKU / Part No.</div>
                <div style={{ ...S.metaValue, fontFamily: 'monospace', fontSize: '.85rem' }}>{partNo}</div>
              </div>
              <div style={S.metaItem}>
                <div style={S.metaLabel}>Brand</div>
                <div style={S.metaValue}>{brand}</div>
              </div>
              <div style={S.metaItem}>
                <div style={S.metaLabel}>Model</div>
                <div style={S.metaValue}>{model}</div>
              </div>
              <div style={S.metaItem}>
                <div style={S.metaLabel}>Category</div>
                <div style={S.metaValue}>{category}</div>
              </div>
              <div style={S.metaItem}>
                <div style={S.metaLabel}>Warranty</div>
                <div style={S.metaValue}>{warranty}</div>
              </div>
              <div style={S.metaItem}>
                <div style={S.metaLabel}>Origin</div>
                <div style={S.metaValue}>{origin}</div>
              </div>
            </div>
          </div>

          {/* RIGHT — info + edit */}
          <div style={S.infoBox}>
            <div style={S.detailBrand}>{info.emoji} {brand}</div>
            <h2 style={S.detailName}>{part}</h2>
            <div style={S.detailModel}>For {brand} {model} · {category}</div>

            <div style={{ display: 'flex', alignItems: 'baseline', gap: 16, marginBottom: 20 }}>
              <div style={S.detailPrice}>৳{price.toLocaleString()}</div>
              <span style={S.partStock}>● {stock} in stock</span>
            </div>

            <p style={{ color: '#9aa0af', lineHeight: 1.7, marginBottom: 20, fontSize: '.95rem' }}>{desc}</p>

            <a href={`https://wa.me/8801707659954?text=${encodeURIComponent(waMsg)}`} target="_blank"
              style={{ ...S.waBtn, textDecoration: 'none', marginTop: 0, fontSize: '1rem', padding: '14px 24px' }}>
              💬 Order on WhatsApp
            </a>

            {/* EDITABLE SECTION */}
            <div style={S.editSection}>
              <div style={S.editTitle}>✏️ Edit Product Details</div>

              <label style={S.fieldLabel}>Product Description</label>
              <textarea style={S.textarea} value={desc} onChange={e => setDesc(e.target.value)}
                onFocus={e => e.target.style.borderColor = '#e8a020'}
                onBlur={e => e.target.style.borderColor = '#252830'} />

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                <div>
                  <label style={S.fieldLabel}>Part Number / SKU</label>
                  <input style={S.input} value={partNo} onChange={e => setPartNo(e.target.value)}
                    onFocus={e => e.target.style.borderColor = '#e8a020'}
                    onBlur={e => e.target.style.borderColor = '#252830'} />
                </div>
                <div>
                  <label style={S.fieldLabel}>Weight (e.g. 250g)</label>
                  <input style={S.input} placeholder="e.g. 250g" value={weight} onChange={e => setWeight(e.target.value)}
                    onFocus={e => e.target.style.borderColor = '#e8a020'}
                    onBlur={e => e.target.style.borderColor = '#252830'} />
                </div>
                <div>
                  <label style={S.fieldLabel}>Warranty</label>
                  <input style={S.input} value={warranty} onChange={e => setWarranty(e.target.value)}
                    onFocus={e => e.target.style.borderColor = '#e8a020'}
                    onBlur={e => e.target.style.borderColor = '#252830'} />
                </div>
                <div>
                  <label style={S.fieldLabel}>Country of Origin</label>
                  <input style={S.input} value={origin} onChange={e => setOrigin(e.target.value)}
                    onFocus={e => e.target.style.borderColor = '#e8a020'}
                    onBlur={e => e.target.style.borderColor = '#252830'} />
                </div>
              </div>

              <label style={S.fieldLabel}>Additional Notes / Fitment Info</label>
              <textarea style={{ ...S.textarea, minHeight: 70 }} placeholder="e.g. Fits 2018–2023 models only. OEM reference: xxxxxx" value={notes} onChange={e => setNotes(e.target.value)}
                onFocus={e => e.target.style.borderColor = '#e8a020'}
                onBlur={e => e.target.style.borderColor = '#252830'} />

              <div style={{ display: 'flex', alignItems: 'center' }}>
                <button style={S.saveBtn} onClick={handleSave}>💾 Save Details</button>
                {savedOk && <span style={S.savedBadge}>✅ Saved!</span>}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─────────────── APP ─────────────── */
export default function App() {
  const [page, setPage] = useState('brands');
  const [brand, setBrand] = useState(null);
  const [model, setModel] = useState(null);
  const [category, setCategory] = useState(null);
  const [part, setPart] = useState(null);

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [page]);

  function nav(key) {
    if (key === 'home' || key === 'brands') { setPage('brands'); setBrand(null); setModel(null); setCategory(null); setPart(null); }
    else if (key === 'models') { setPage('models'); setModel(null); setCategory(null); setPart(null); }
    else if (key === 'categories') { setPage('categories'); setCategory(null); setPart(null); }
    else if (key === 'parts') { setPage('parts'); setPart(null); }
    else if (key === 'product') { setPage('product'); }
  }

  const trail = [];
  if (brand) trail.push({ label: brand, key: 'models' });
  if (model) trail.push({ label: model, key: 'categories' });
  if (category) trail.push({ label: category, key: 'parts' });
  if (part) trail.push({ label: part.length > 22 ? part.slice(0, 20) + '…' : part, key: 'product' });

  return (
    <>
      <Navbar trail={trail} onCrumb={nav} />

      {page === 'brands' && (
        <BrandsPage onSelect={b => { setBrand(b); setPage('models'); }} />
      )}
      {page === 'models' && brand && (
        <ModelsPage brand={brand} onSelect={m => { setModel(m); setPage('categories'); }} />
      )}
      {page === 'categories' && brand && model && (
        <CategoriesPage brand={brand} model={model} onSelect={c => { setCategory(c); setPage('parts'); }} />
      )}
      {page === 'parts' && brand && model && category && (
        <PartsPage brand={brand} model={model} category={category} onSelect={p => { setPart(p); setPage('product'); }} />
      )}
      {page === 'product' && brand && model && category && part && (
        <ProductPage brand={brand} model={model} category={category} part={part} />
      )}

      <a href="https://wa.me/8801707659954" target="_blank" style={S.floatWa} title="WhatsApp">💬</a>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
